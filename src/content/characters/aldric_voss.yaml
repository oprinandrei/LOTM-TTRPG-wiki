abilities:
  - name: Occult Mastery
    description: "Every time you receive effective, authentic, non-repetitive occult guidance lasting at least 2 hours, your Occult skill increases by 1 level. You need 2, 3, and 4 learning sessions to reach Proficiency, Advanced, and Master levels respectively. Learning is limited to 1 session per day for knowledge digestion."
  - name: Divination
    cost: "1 Action, 2 Spirituality"
    description: "You master astrology, card divination, pendulums, spiritual vision, numerology, palmistry, and other divination methods. Perform 1 Occult check — Difficulty 15 gives vague results, Difficulty 20 gives a general direction, Difficulty 25 gives specific results."

