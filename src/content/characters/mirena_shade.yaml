abilities:
  - name: Enhanced Skill Mastery
    description: "You excel at fighting, shooting, and climbing, gaining mastery over their subdivision skills. You can learn these skills through effective training of at least 2 hours per session, increasing the corresponding skill by 1 level. From trainee to proficient: 2 sessions. To advanced: 3 sessions. To master: 4 sessions. You can learn once per day."
  - name: Blessed of the Night
    description: "The deeper the night, the more energetic you become. At Dusk: Attribute and skill identification +1 (favorable). At Night: All attributes +1, identification +2 (favorable). At Late Night (11 PM–3 AM): All attributes +2, identification +2 (favorable). Fast Dodge: During night/late night, gain complete physical defense against firearms (excluding light and lightning). Gain 1 extra level of dodge."

items:
  - name: Lockpick Set
    description: "A professional set of tension wrenches and picks concealed in a slim leather wallet."
  - name: Black Silk Bodysuit
    description: "Tight-fitting night-work attire treated with a muffling compound to suppress noise during movement."
  - name: Throwing Knives (×4)
    description: "Four balanced steel throwing knives worn in a concealed forearm sheath."
  - name: Dark Lantern
    description: "A bull's-eye lantern with a sliding shutter. Provides directional light that can be fully blocked."
