abilities:
  - name: Corpse Characteristics
    description: "You gain corpse-like traits that grant 5 resistance to cold, poison, and curse. Ordinary undead (ghosts, zombies) mistake you for one of their own — does not include undead with outstanding intelligence or those transformed by Beyonders. Appearance changes: quite gloomy with lower body temperature, whiter skin. Every 2-hour autopsy of a unique undead type increases Knowledge of the Dead by 1 level."
  - name: Knowledge of the Dead
    description: "You know the traits and weaknesses of many undead creatures. This skill replaces Biology for corpse identification. Using it on a corpse reveals: Difficulty 15 — general cause and time of death. Difficulty 20 — exact cause, specific weapon, extraordinary power type. Difficulty 25 — pre-death treatment, disguised suicides, post-death fighting. Difficulty 30 — living conditions, drug use, Beyonder training."

items:
  - name: Physician's Bag
    description: "A well-worn leather bag containing surgical instruments, bandages, antiseptic tinctures, and sedatives. Ezra never leaves home without it."
  - name: Autopsy Journal
    description: "Thick ledger documenting every corpse examined — cause of death, extraordinary factors noted, and personal observations in a cramped clinical hand."
  - name: Spirit Sight Monocle
    description: "A brass monocle fitted with a faintly smoky lens. When worn, enables passive spirit vision, revealing nearby evil spirits as dim silhouettes."
